
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; }
#app {
  display: flex;
  gap: 16px;
  padding: 16px;
  justify-content: center;
  align-items: flex-start;
  font-family: var(--font-mono, monospace);
}
#game-area { display: flex; flex-direction: column; align-items: center; gap: 8px; }
canvas#board {
  border: 2px solid var(--color-border-primary);
  border-radius: 4px;
  background: #0a0a1a;
  display: block;
}
#side-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 140px;
}
.panel-card {
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  padding: 10px 12px;
}
.panel-label {
  font-size: 11px;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}
.panel-value {
  font-size: 22px;
  font-weight: 500;
  color: var(--color-text-primary);
  line-height: 1.2;
}
.stage-bar-wrap {
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: 99px;
  height: 6px;
  margin-top: 6px;
  overflow: hidden;
}
#stage-bar { height: 100%; background: #7F77DD; border-radius: 99px; transition: width 0.3s; width: 0%; }
canvas#next-canvas {
  background: #0a0a1a;
  border-radius: 4px;
  border: 0.5px solid var(--color-border-tertiary);
  display: block;
  margin: 0 auto;
}
#item-log {
  font-size: 12px;
  color: var(--color-text-secondary);
  min-height: 40px;
  line-height: 1.5;
}
.item-msg { color: #EF9F27; font-weight: 500; }
#overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10,10,26,0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border-radius: 4px;
}
#overlay h2 { color: #fff; font-size: 20px; font-weight: 500; }
#overlay p { color: #aaa; font-size: 13px; }
#overlay button {
  margin-top: 8px;
  padding: 8px 24px;
  border-radius: var(--border-radius-md);
  border: 0.5px solid #7F77DD;
  background: #26215C;
  color: #CECBF6;
  font-size: 14px;
  cursor: pointer;
}
#overlay button:hover { background: #3C3489; }
#board-wrap { position: relative; }
#controls-hint {
  font-size: 11px;
  color: var(--color-text-secondary);
  text-align: center;
  line-height: 1.8;
}
</style>

<div id="app">
  <div id="game-area">
    <div id="board-wrap">
      <canvas id="board" width="240" height="480"></canvas>
      <div id="overlay">
        <h2>TETRIS</h2>
        <p>아이템이 포함된 테트리스!</p>
        <button id="start-btn">게임 시작</button>
      </div>
    </div>
    <div id="controls-hint">
      ← → 이동 &nbsp;|&nbsp; ↑ 회전 &nbsp;|&nbsp; ↓ 소프트드롭 &nbsp;|&nbsp; Space 하드드롭
    </div>
  </div>

  <div id="side-panel">
    <div class="panel-card">
      <div class="panel-label">점수</div>
      <div class="panel-value" id="score-display">0</div>
    </div>
    <div class="panel-card">
      <div class="panel-label">스테이지</div>
      <div class="panel-value" id="stage-display">1</div>
      <div class="stage-bar-wrap"><div id="stage-bar"></div></div>
    </div>
    <div class="panel-card">
      <div class="panel-label">줄 제거</div>
      <div class="panel-value" id="lines-display">0</div>
    </div>
    <div class="panel-card">
      <div class="panel-label">다음 블록</div>
      <canvas id="next-canvas" width="100" height="80"></canvas>
    </div>
    <div class="panel-card">
      <div class="panel-label">아이템 효과</div>
      <div id="item-log">아이템을 획득해 보세요!</div>
    </div>
  </div>
</div>

<script>
const COLS = 12, ROWS = 20, CELL = 20;
const board = document.getElementById('board');
const bctx = board.getContext('2d');
board.width = COLS * CELL;
board.height = ROWS * CELL;

const nextCanvas = document.getElementById('next-canvas');
const nctx = nextCanvas.getContext('2d');

const PIECES = [
  { shape: [[1,1,1,1]], color: '#1D9E75', name: 'I' },
  { shape: [[1,1],[1,1]], color: '#7F77DD', name: 'O' },
  { shape: [[0,1,0],[1,1,1]], color: '#D85A30', name: 'T' },
  { shape: [[1,0],[1,0],[1,1]], color: '#378ADD', name: 'L' },
  { shape: [[0,1],[0,1],[1,1]], color: '#D4537E', name: 'J' },
  { shape: [[0,1,1],[1,1,0]], color: '#EF9F27', name: 'S' },
  { shape: [[1,1,0],[0,1,1]], color: '#E24B4A', name: 'Z' },
  { shape: [[1,0],[1,1],[0,1]], color: '#5DCAA5', name: 'X' }
];

const ITEMS = [
  { id: 'bomb', color: '#fff', label: '💥', desc: '전체 폭파', sym: '★' },
  { id: 'line3', color: '#FAC775', label: '═══', desc: '막대 3줄 추가', sym: '▶' },
  { id: 'clear_bottom', color: '#85B7EB', label: '▼', desc: '맨 아래줄 제거', sym: '▼' },
  { id: 'slow', color: '#9FE1CB', label: '⏱', desc: '속도 감소 5초', sym: '◆' },
  { id: 'ghost', color: '#AFA9EC', label: '👻', desc: '다음 블록 투명', sym: '◇' }
];

let grid, score, lines, stage, falling, nextPiece, gameOver, paused, animId, dropInterval, lastDrop, slowTimer, ghostMode;

function emptyGrid() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function randomPiece() {
  const p = PIECES[Math.floor(Math.random() * PIECES.length)];
  const itemRoll = Math.random();
  let item = null;
  if (itemRoll < 0.18) {
    item = ITEMS[Math.floor(Math.random() * ITEMS.length)];
  }
  return {
    shape: p.shape.map(r => [...r]),
    color: p.color,
    name: p.name,
    x: Math.floor(COLS / 2) - Math.floor(p.shape[0].length / 2),
    y: 0,
    item
  };
}

function rotate(shape) {
  const R = shape.length, C = shape[0].length;
  return Array.from({ length: C }, (_, c) =>
    Array.from({ length: R }, (_, r) => shape[R - 1 - r][c])
  );
}

function valid(shape, x, y) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const nr = r + y, nc = c + x;
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return false;
      if (grid[nr][nc]) return false;
    }
  }
  return true;
}

function place() {
  const { shape, color, x, y, item } = falling;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const gr = r + y, gc = c + x;
      if (gr >= 0) grid[gr][gc] = { color, item: (r === 0 && c === 0 && item) ? item : null };
    }
  }
  if (item) applyItemOnPlace(item);
  clearLines();
  falling = nextPiece;
  nextPiece = randomPiece();
  if (ghostMode) { falling.color = 'rgba(180,180,180,0.25)'; ghostMode = false; }
  if (!valid(falling.shape, falling.x, falling.y)) endGame();
}

function applyItemOnPlace(item) {
  setItemMsg(item.desc);
  if (item.id === 'bomb') {
    grid = emptyGrid();
    score += 500;
  } else if (item.id === 'line3') {
    for (let i = 0; i < 3; i++) {
      grid.shift();
      grid.push(Array(COLS).fill(null));
    }
    score += 300;
    lines += 3;
  } else if (item.id === 'clear_bottom') {
    grid.pop();
    grid.unshift(Array(COLS).fill(null));
    score += 100;
    lines += 1;
  } else if (item.id === 'slow') {
    slowTimer = Date.now() + 5000;
  } else if (item.id === 'ghost') {
    ghostMode = true;
  }
}

function setItemMsg(msg) {
  const el = document.getElementById('item-log');
  el.innerHTML = `<span class="item-msg">${msg} 발동!</span>`;
  setTimeout(() => { el.textContent = '아이템을 획득해 보세요!'; }, 3000);
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r].every(c => c !== null)) {
      grid.splice(r, 1);
      grid.unshift(Array(COLS).fill(null));
      cleared++;
      r++;
    }
  }
  if (cleared > 0) {
    const pts = [0, 100, 300, 500, 800][Math.min(cleared, 4)] * stage;
    score += pts;
    lines += cleared;
    updateUI();
  }
}

function updateUI() {
  document.getElementById('score-display').textContent = score.toLocaleString();
  document.getElementById('lines-display').textContent = lines;
  const newStage = Math.floor(score / 1000) + 1;
  if (newStage !== stage) {
    stage = newStage;
    document.getElementById('stage-display').textContent = stage;
  }
  document.getElementById('stage-display').textContent = stage;
  const pct = ((score % 1000) / 1000) * 100;
  document.getElementById('stage-bar').style.width = pct + '%';
}

function getDropDelay() {
  const base = Math.max(100, 700 - (stage - 1) * 60);
  if (slowTimer && Date.now() < slowTimer) return base * 2;
  return base;
}

function ghostY() {
  let gy = falling.y;
  while (valid(falling.shape, falling.x, gy + 1)) gy++;
  return gy;
}

function draw() {
  bctx.clearRect(0, 0, board.width, board.height);
  bctx.fillStyle = '#0a0a1a';
  bctx.fillRect(0, 0, board.width, board.height);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (r % 2 === 0 && c % 2 === 0) {
        bctx.fillStyle = 'rgba(255,255,255,0.02)';
        bctx.fillRect(c * CELL, r * CELL, CELL, CELL);
      }
    }
  }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = grid[r][c];
      if (cell) {
        drawCell(bctx, c, r, cell.color, cell.item);
      }
    }
  }

  if (falling) {
    const gy = ghostY();
    for (let r = 0; r < falling.shape.length; r++) {
      for (let c = 0; c < falling.shape[r].length; c++) {
        if (!falling.shape[r][c]) continue;
        const gr = r + gy, gc = c + falling.x;
        if (gr >= 0) {
          bctx.fillStyle = 'rgba(255,255,255,0.08)';
          bctx.fillRect(gc * CELL + 1, gr * CELL + 1, CELL - 2, CELL - 2);
        }
      }
    }
    for (let r = 0; r < falling.shape.length; r++) {
      for (let c = 0; c < falling.shape[r].length; c++) {
        if (!falling.shape[r][c]) continue;
        const gr = r + falling.y, gc = c + falling.x;
        if (gr >= 0) {
          drawCell(bctx, gc, gr, falling.color, (r === 0 && c === 0) ? falling.item : null);
        }
      }
    }
  }

  drawNext();
}

function drawCell(ctx, c, r, color, item) {
  const x = c * CELL, y = r * CELL;
  ctx.fillStyle = color;
  ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x + 1, y + 1, CELL - 2, 3);
  if (item) {
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${CELL * 0.5}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.sym, x + CELL / 2, y + CELL / 2);
  }
}

function drawNext() {
  nctx.fillStyle = '#0a0a1a';
  nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;
  const s = nextPiece.shape;
  const cs = 16;
  const ox = Math.floor((nextCanvas.width - s[0].length * cs) / 2);
  const oy = Math.floor((nextCanvas.height - s.length * cs) / 2);
  for (let r = 0; r < s.length; r++) {
    for (let c = 0; c < s[r].length; c++) {
      if (!s[r][c]) continue;
      nctx.fillStyle = nextPiece.color;
      nctx.fillRect(ox + c * cs + 1, oy + r * cs + 1, cs - 2, cs - 2);
    }
  }
  if (nextPiece.item) {
    nctx.fillStyle = '#FAC775';
    nctx.font = 'bold 10px monospace';
    nctx.textAlign = 'right';
    nctx.textBaseline = 'top';
    nctx.fillText('ITEM', nextCanvas.width - 4, 4);
  }
}

function loop(ts) {
  if (gameOver || paused) return;
  if (!lastDrop) lastDrop = ts;
  if (ts - lastDrop > getDropDelay()) {
    if (valid(falling.shape, falling.x, falling.y + 1)) {
      falling.y++;
    } else {
      place();
    }
    lastDrop = ts;
    updateUI();
  }
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  grid = emptyGrid();
  score = 0; lines = 0; stage = 1; gameOver = false; paused = false;
  slowTimer = null; ghostMode = false; lastDrop = null;
  falling = randomPiece();
  nextPiece = randomPiece();
  document.getElementById('overlay').style.display = 'none';
  updateUI();
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

function endGame() {
  gameOver = true;
  cancelAnimationFrame(animId);
  const ov = document.getElementById('overlay');
  ov.querySelector('h2').textContent = 'GAME OVER';
  ov.querySelector('p').textContent = `최종 점수: ${score.toLocaleString()} | 스테이지: ${stage}`;
  ov.querySelector('button').textContent = '다시 시작';
  ov.style.display = 'flex';
}

document.getElementById('start-btn').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  if (gameOver || paused) return;
  if (!falling) return;
  switch (e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      if (valid(falling.shape, falling.x - 1, falling.y)) falling.x--;
      break;
    case 'ArrowRight':
      e.preventDefault();
      if (valid(falling.shape, falling.x + 1, falling.y)) falling.x++;
      break;
    case 'ArrowDown':
      e.preventDefault();
      if (valid(falling.shape, falling.x, falling.y + 1)) { falling.y++; score += 1; }
      else { place(); updateUI(); }
      lastDrop = performance.now();
      break;
    case 'ArrowUp':
      e.preventDefault();
      const rotated = rotate(falling.shape);
      if (valid(rotated, falling.x, falling.y)) falling.shape = rotated;
      break;
    case ' ':
      e.preventDefault();
      while (valid(falling.shape, falling.x, falling.y + 1)) { falling.y++; score += 2; }
      place(); updateUI();
      lastDrop = performance.now();
      break;
  }
  draw();
});

draw();
</script>
